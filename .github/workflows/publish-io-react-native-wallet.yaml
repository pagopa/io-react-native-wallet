name: Publish @pagopa/io-react-native-wallet to NPM

on:
  release:
    types:
      - created

jobs:
  check_release_title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_skip: ${{ steps.check_title.outputs.should_skip }}

    steps:
      - name: Check release title
        id: check_title
        run: |
          if echo "${{ github.event.release.name }}" | grep -iq "example"; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check_release_title
    if: needs.check_release_title.outputs.should_skip == 'false'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write # Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up environment
        uses: ./.github/actions/setup-composite

      - name: Generate client
        run: pnpm --filter @io-app-it-wallet/io-react-native-wallet generate

      - name: Type-check library
        run: pnpm --filter @io-app-it-wallet/io-react-native-wallet tsc

      - name: Install npm
        run: npm install --global npm@11.5.1

      - name: Set published package name
        working-directory: libs/io-react-native-wallet
        # Publish under the @pagopa scope while keeping the workspace-internal name unchanged.
        run: npm pkg set name="@pagopa/io-react-native-wallet"

      - name: Publish package
        working-directory: libs/io-react-native-wallet
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([a-zA-Z]+)\.[0-9]+$ ]]; then
            npm publish --access=public --tag="${BASH_REMATCH[1]}" --provenance
          else
            npm publish --access=public --provenance
          fi
