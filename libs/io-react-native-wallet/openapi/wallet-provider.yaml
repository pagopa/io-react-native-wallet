openapi: 3.0.1
info:
  title: IT-Wallet User - IO App v1
  description: REST APIs consumed by IO App
  version: v1
servers:
  - url: https://api-app.io.pagopa.it/api/wallet/v1
paths:
  "/nonce":
    get:
      summary: GetNonce
      description: Returns a randomly generated nonce
      operationId: getNonce
      responses:
        "200":
          description: Nonce successfully generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonceDetailView"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/wallet-instances":
    post:
      summary: CreateWalletInstance
      description: Create a wallet instance
      operationId: createWalletInstance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletInstanceBody"
            example:
              challenge: string
              key_attestation: string
              hardware_key_tag: string
              is_renewal: true
      responses:
        "204":
          description: Wallet instance successfully created
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/wallet-attestations":
    post:
      summary: CreateWalletAttestation
      description: Create and return a Wallet Attestation
      operationId: createWalletAttestation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletAttestationBody"
      responses:
        "200":
          description: List of generated Wallet Attestations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAttestationsView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/wallet-instances/current/status":
    get:
      summary: GetCurrentWalletInstanceStatus
      description: Retrieve the current Wallet Instance status
      operationId: getCurrentWalletInstanceStatus
      responses:
        "200":
          description: Wallet Instance status successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInstanceData"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/wallet-instances/{id}/status":
    get:
      summary: GetWalletInstanceStatus
      description: Retrieve a Wallet Instance status
      operationId: getWalletInstanceStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet Instance status successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInstanceData"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      summary: SetWalletInstanceStatus
      description: |
        Revoke the Wallet Instance associated with the authenticated user.
        If the Wallet Instance is already revoked, the operation will succeed.
      operationId: setWalletInstanceStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetWalletInstanceStatusData"
      responses:
        "204":
          description: Wallet Instance status successfully set
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/info":
    get:
      summary: HealthCheck
      description: Used to check if the function is healthy
      operationId: healthCheck
      responses:
        "200":
          description: The function is health
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: string
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/whitelisted-fiscal-code":
    get:
      summary: IsFiscalCodeWhitelisted
      description: Used to check if the fiscal code is in the whitelist
      operationId: isFiscalCodeWhitelisted
      responses:
        "200":
          description:
            Returned when no issues were found in either case (fiscal code
            whitelisted, or not)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistedFiscalCodeData"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/wallet-instance-attestations":
    post:
      summary: CreateWalletInstanceAttestation
      description: Create and return a Wallet Instance Attestation (WIA)
      operationId: createWalletInstanceAttestation
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/CreateWalletInstanceAttestationBody"
      responses:
        "200":
          description: Wallet Instance Attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInstanceAttestation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/wallet-unit-attestations":
    post:
      summary: CreateWalletUnitAttestation
      description: Create and return a Wallet Unit Attestation (WUA)
      operationId: createWalletUnitAttestation
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/CreateWalletUnitAttestationBody"
      responses:
        "200":
          description: Wallet Unit Attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletUnitAttestation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  "/key-attestations":
    post:
      summary: CreateKeyAttestation
      description: Create and return a Key Attestation
      operationId: createKeyAttestation
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/CreateKeyAttestationBody"
      responses:
        "200":
          description: Key Attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyAttestation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/token-exchanges:
    post:
      operationId: createAuthTokenExchange
      summary: Exchange the Wallet session for a short-lived NSSAM access token
      description: |
        Mini-IdP endpoint. Returns an RS256 JWT access token for NSSAM whose
        `nameid` is the caller's only active (non-revoked) Wallet Instance,
        resolved server-side from `x-user-id`. If more than one active Wallet
        Instance exists for the user, 409 is returned. No request body is
        read: client-provided identifiers never influence the token.
      responses:
        "200":
          description: NSSAM access token
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NssamAccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /remote-wscd/sessions:
    post:
      operationId: createRemoteWscdSession
      summary: Open an NSSAM session
      description: |
        Proxies NSSAM Driver `POST /api/v1/startsession`.
        The Backend neither decrypts `encryptionKey` nor verifies `signature`:
        the App does.
        Any `data` and KeyBlob are forwarded verbatim to the NSSAM
        Driver and are never decrypted, persisted or logged by the Backend.
        Each NSSAM session serves exactly one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWscdStartSessionRequest"
      responses:
        "200":
          description: NSSAM session opened
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWscdStartSessionResponse"
        "400":
          $ref: "#/components/responses/RemoteWscdError"
        "401":
          $ref: "#/components/responses/RemoteWscdError"
        "403":
          $ref: "#/components/responses/RemoteWscdError"
        "409":
          $ref: "#/components/responses/RemoteWscdError"
        "422":
          $ref: "#/components/responses/RemoteWscdError"
        "423":
          $ref: "#/components/responses/RemoteWscdError"
        "429":
          $ref: "#/components/responses/RemoteWscdError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/RemoteWscdError"
        "503":
          $ref: "#/components/responses/RemoteWscdError"
        "504":
          $ref: "#/components/responses/RemoteWscdError"

  /remote-wscd/session-cancellations:
    post:
      operationId: createRemoteWscdSessionCancellation
      summary: Cancel an unused NSSAM session
      description: |
        Proxies NSSAM Driver `POST /api/v1/cancelsession`.
        Any `data` and KeyBlob are forwarded verbatim to the NSSAM
        Driver and are never decrypted, persisted or logged by the Backend.
        Each NSSAM session serves exactly one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWscdCancelSessionRequest"
      responses:
        "204":
          description: NSSAM session cancelled
        "400":
          $ref: "#/components/responses/RemoteWscdError"
        "401":
          $ref: "#/components/responses/RemoteWscdError"
        "403":
          $ref: "#/components/responses/RemoteWscdError"
        "409":
          $ref: "#/components/responses/RemoteWscdError"
        "422":
          $ref: "#/components/responses/RemoteWscdError"
        "423":
          $ref: "#/components/responses/RemoteWscdError"
        "429":
          $ref: "#/components/responses/RemoteWscdError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/RemoteWscdError"
        "503":
          $ref: "#/components/responses/RemoteWscdError"
        "504":
          $ref: "#/components/responses/RemoteWscdError"

  /remote-wscd/keys:
    post:
      operationId: createRemoteWscdKey
      summary: Enroll a new key in the Remote WSCD
      description: |
        Proxies NSSAM Driver `POST /api/v1/enroll`.
        The `kec` field of the response is added by WLEO-1427.
        Any `data` and KeyBlob are forwarded verbatim to the NSSAM
        Driver and are never decrypted, persisted or logged by the Backend.
        Each NSSAM session serves exactly one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWscdEnrollRequest"
      responses:
        "200":
          description: Enrolled key
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWscdEnrollResponse"
        "400":
          $ref: "#/components/responses/RemoteWscdError"
        "401":
          $ref: "#/components/responses/RemoteWscdError"
        "403":
          $ref: "#/components/responses/RemoteWscdError"
        "409":
          $ref: "#/components/responses/RemoteWscdError"
        "422":
          $ref: "#/components/responses/RemoteWscdError"
        "423":
          $ref: "#/components/responses/RemoteWscdError"
        "429":
          $ref: "#/components/responses/RemoteWscdError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/RemoteWscdError"
        "503":
          $ref: "#/components/responses/RemoteWscdError"
        "504":
          $ref: "#/components/responses/RemoteWscdError"

  /remote-wscd/pin-changes:
    post:
      operationId: createRemoteWscdPinChange
      summary: Change the PIN of a Remote WSCD key
      description: |
        Proxies NSSAM Driver `POST /api/v1/changepin`.
        Any `data` and KeyBlob are forwarded verbatim to the NSSAM
        Driver and are never decrypted, persisted or logged by the Backend.
        Each NSSAM session serves exactly one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWscdKeyOperationRequest"
      responses:
        "200":
          description: New KeyBlob
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWscdChangePinResponse"
        "400":
          $ref: "#/components/responses/RemoteWscdError"
        "401":
          $ref: "#/components/responses/RemoteWscdError"
        "403":
          $ref: "#/components/responses/RemoteWscdError"
        "409":
          $ref: "#/components/responses/RemoteWscdError"
        "422":
          $ref: "#/components/responses/RemoteWscdError"
        "423":
          $ref: "#/components/responses/RemoteWscdError"
        "429":
          $ref: "#/components/responses/RemoteWscdError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/RemoteWscdError"
        "503":
          $ref: "#/components/responses/RemoteWscdError"
        "504":
          $ref: "#/components/responses/RemoteWscdError"

  /remote-wscd/signatures:
    post:
      operationId: createRemoteWscdSignature
      summary: Sign a hash with a Remote WSCD key
      description: |
        Proxies NSSAM Driver `POST /api/v1/hashsign`.
        Any `data` and KeyBlob are forwarded verbatim to the NSSAM
        Driver and are never decrypted, persisted or logged by the Backend.
        Each NSSAM session serves exactly one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWscdKeyOperationRequest"
      responses:
        "200":
          description: Signature
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWscdHashSignResponse"
        "400":
          $ref: "#/components/responses/RemoteWscdError"
        "401":
          $ref: "#/components/responses/RemoteWscdError"
        "403":
          $ref: "#/components/responses/RemoteWscdError"
        "409":
          $ref: "#/components/responses/RemoteWscdError"
        "422":
          $ref: "#/components/responses/RemoteWscdError"
        "423":
          $ref: "#/components/responses/RemoteWscdError"
        "429":
          $ref: "#/components/responses/RemoteWscdError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/RemoteWscdError"
        "503":
          $ref: "#/components/responses/RemoteWscdError"
        "504":
          $ref: "#/components/responses/RemoteWscdError"
components:
  schemas:
    SetWalletInstanceStatusData:
      required:
        - status
      type: object
      properties:
        status:
          enum:
            - REVOKED
          type: string
      example:
        status: REVOKED
    WalletInstanceData:
      required:
        - id
        - is_revoked
      type: object
      properties:
        id:
          type: string
        is_revoked:
          type: boolean
        revocation_reason:
          $ref: "#/components/schemas/RevocationReason"
      description: Describes the status of the wallet.
      example:
        id: string
        is_revoked: true
        revocation_reason: CERTIFICATE_REVOKED_BY_ISSUER
    NonceDetailView:
      required:
        - nonce
      type: object
      properties:
        nonce:
          type: string
    WalletAttestationsView:
      required:
        - wallet_attestations
      type: object
      properties:
        wallet_attestations:
          maxItems: 2
          minItems: 2
          type: array
          items:
            required:
              - format
              - wallet_attestation
            type: object
            properties:
              format:
                enum:
                  - jwt
                  - dc+sd-jwt
                type: string
              wallet_attestation:
                type: string
    WalletInstanceAttestation:
      required:
        - wallet_instance_attestation
      type: object
      properties:
        wallet_instance_attestation:
          type: string
      example:
        wallet_instance_attestation: string
    WalletUnitAttestation:
      required:
        - wallet_unit_attestation
      type: object
      properties:
        wallet_unit_attestation:
          type: string
      example:
        wallet_unit_attestation: string
    CreateWalletInstanceBody:
      required:
        - challenge
        - key_attestation
        - hardware_key_tag
      type: object
      properties:
        challenge:
          minLength: 1
          type: string
          format: binary
        key_attestation:
          minLength: 1
          type: string
          format: binary
        hardware_key_tag:
          minLength: 1
          type: string
        is_renewal:
          type: boolean
          default: false
      example:
        challenge: string
        key_attestation: string
        hardware_key_tag: string
    CreateWalletAttestationBody:
      required:
      - assertion
      type: object
      properties:
        assertion:
          minLength: 1
          type: string
          format: binary
          example: eyJhbGciOiJFUzI1NiIsImtpZCI6InZiZVhKa3NNNDV4cGh0QU5uQ2lHNm1DeXVVNGpmR056b3BHdUt2b2dnOWMiLCJ0eXAiOiJ3YXIrand0In0..F32bisVth4eDdGxDjB9ByENT-oZLtSY_89uwTSePo2GMEKaeEedpXZE_9mrX7t0_Fmc5m6LNVvIIBqotqsYJYQ
      example:
        assertion: eyJhbGciOiJFUzI1NiIsImtpZCI6InZiZVhKa3NNNDV4cGh0QU5uQ2lHNm1DeXVVNGpmR056b3BHdUt2b2dnOWMiLCJ0eXAiOiJ3YXIrand0In0..F32bisVth4eDdGxDjB9ByENT-oZLtSY_89uwTSePo2GMEKaeEedpXZE_9mrX7t0_Fmc5m6LNVvIIBqotqsYJYQ
    CreateWalletInstanceAttestationBody:
      type: string
      minLength: 1
      example: eyJhbGciOiJFUzI1NiIsImtpZCI6InZiZVhKa3NNNDV4cGh0QU5uQ2lHNm1DeXVVNGpmR056b3BHdUt2b2dnOWMiLCJ0eXAiOiJ3YXIrand0In0..F32bisVth4eDdGxDjB9ByENT-oZLtSY_89uwTSePo2GMEKaeEedpXZE_9mrX7t0_Fmc5m6LNVvIIBqotqsYJYQ
    CreateWalletUnitAttestationBody:
      type: string
      minLength: 1
    CreateKeyAttestationBody:
      type: string
      minLength: 1
    KeyAttestation:
      required:
      - key_attestation
      type: object
      properties:
        key_attestation:
          type: string
      example:
        key_attestation: string
    RevocationReason:
      enum:
        - CERTIFICATE_REVOKED_BY_ISSUER
        - NEW_WALLET_INSTANCE_CREATED
        - WALLET_INSTANCE_RENEWAL
        - REVOKED_BY_USER
      type: string
    NssamAccessTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          format: jwt
          description: |
            RS256 JWT with claims `iss`, `iat`, `nbf`, `exp` and `nameid`
            (Wallet Instance identifier).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Lifetime in seconds (`exp` - `iat`).

    RemoteWscdRsaPublicKey:
      type: object
      description: Ephemeral RSA 3072 public key of the App, base64 (RFC 4648 §4, padded).
      required: [modulus, exponent]
      properties:
        modulus:
          type: string
          format: byte
          minLength: 1
          description: Big-endian modulus of a 3072-bit RSA key.
        exponent:
          type: string
          format: byte
          minLength: 1
          description: Big-endian odd public exponent, at most 8 bytes.

    RemoteWscdStartSessionRequest:
      type: object
      description: Body of `POST /remote-wscd/sessions`.
      required: [clientPubKey, jwtToken]
      properties:
        clientPubKey:
          $ref: "#/components/schemas/RemoteWscdRsaPublicKey"
        jwtToken:
          type: string
          format: jwt
          description: RS256 NSSAM access token issued by `/auth/token-exchanges`.

    RemoteWscdStartSessionResponse:
      type: object
      description: Opened NSSAM session.
      required: [sessionId, encryptionKey, signature]
      properties:
        sessionId:
          type: string
          pattern: '^\S+$'
          description: Opaque NSSAM session identifier returned by `POST /remote-wscd/sessions`.
        encryptionKey:
          type: string
          format: byte
          minLength: 1
          description: Session key encrypted for `clientPubKey`; decrypted by the App only.
        signature:
          type: string
          format: byte
          minLength: 1
          description: NSSAM signature over the session data; verified by the App only.

    RemoteWscdCancelSessionRequest:
      type: object
      description: Body of `POST /remote-wscd/session-cancellations`.
      required: [jwtToken, sessionId]
      properties:
        jwtToken:
          type: string
          format: jwt
          description: RS256 NSSAM access token issued by `/auth/token-exchanges`.
        sessionId:
          type: string
          pattern: '^\S+$'
          description: Opaque NSSAM session identifier returned by `POST /remote-wscd/sessions`.

    RemoteWscdEnrollRequest:
      type: object
      description: Body of `POST /remote-wscd/keys`.
      required: [jwtToken, sessionId, data]
      properties:
        jwtToken:
          type: string
          format: jwt
          description: RS256 NSSAM access token issued by `/auth/token-exchanges`.
        sessionId:
          type: string
          pattern: '^\S+$'
          description: Opaque NSSAM session identifier returned by `POST /remote-wscd/sessions`.
        data:
          type: string
          format: byte
          minLength: 1
          description: Encrypted enrollment payload, forwarded verbatim.

    RemoteWscdEnrollResponse:
      type: object
      description: Enrolled key.
      required: [encryptedKey, publicKey]
      properties:
        encryptedKey:
          type: string
          format: byte
          minLength: 1
          description: KeyBlob of the new key, to be stored by the App.
        publicKey:
          type: object
          description: |
            Public key of the enrolled key. For EC keys `modulus` carries the X
            coordinate and `exponent` the Y coordinate.
          required: [keyType, modulus, exponent]
          properties:
            keyType:
              type: string
              enum: [RSA, EC]
            modulus:
              type: string
              format: byte
              minLength: 1
            exponent:
              type: string
              format: byte
              minLength: 1

    RemoteWscdKeyOperationRequest:
      type: object
      description: Body of `POST /remote-wscd/pin-changes` and `POST /remote-wscd/signatures`.
      required: [jwtToken, sessionId, encryptedKey, data]
      properties:
        jwtToken:
          type: string
          format: jwt
          description: RS256 NSSAM access token issued by `/auth/token-exchanges`.
        sessionId:
          type: string
          pattern: '^\S+$'
          description: Opaque NSSAM session identifier returned by `POST /remote-wscd/sessions`.
        encryptedKey:
          type: string
          format: byte
          minLength: 1
          description: KeyBlob of the key, forwarded verbatim.
        data:
          type: string
          format: byte
          minLength: 1
          description: Encrypted operation payload, forwarded verbatim.

    RemoteWscdHashSignResponse:
      type: object
      description: Hash signature.
      required: [signature]
      properties:
        signature:
          type: string
          format: byte
          minLength: 1
          description: Signature computed by NSSAM.

    RemoteWscdChangePinResponse:
      type: object
      description: Result of a PIN change.
      required: [encryptedKey]
      properties:
        encryptedKey:
          type: string
          format: byte
          minLength: 1
          description: New KeyBlob that replaces the old one.

    RemoteWscdProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemJson"
        - type: object
          required: [code, retryable]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - INVALID_TOKEN
                - KEY_INVALID
                - KEY_LOCKED
                - NSSAM_INVALID_RESPONSE
                - NSSAM_REJECTED
                - NSSAM_TIMEOUT
                - NSSAM_UNAVAILABLE
                - PIN_INCORRECT
                - SESSION_INVALID
                - TOO_MANY_SESSIONS
                - WEAK_PIN
            retryable:
              type: boolean
              description: |
                Repeating the whole flow with a fresh token and session may
                succeed without user action. The Backend never retries.
    ProblemJson:
      type: object
      properties:
        type:
          type: string
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          format: uri
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: "A short, summary of the problem type. Written in english and readable for engineers (usually not suited for non technical stakeholders and not localized); example: Service Unavailable"
        status:
          maximum: 600
          exclusiveMaximum: true
          minimum: 100
          type: integer
          description:
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          format: int32
          example: 500
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          example: There was an error processing the request
        instance:
          type: string
          description:
            An absolute URI that identifies the specific occurrence of
            the problem. It may or may not yield further information if dereferenced.
          format: uri
    WhitelistedFiscalCodeData:
      required:
        - whitelisted
        - fiscalCode
      type: object
      properties:
        whitelisted:
          type: boolean
          description:
            Boolean value that specifies whether the tax code is whitelisted
            or not.
        whitelistedAt:
          type: string
          description: |-
            Date, expressed in ISO 8601 format, when the fiscal code was added to the whitelist.
            Only present if the fiscal code is whitelisted.
        fiscalCode:
          type: string
          description: The fiscal code, the same one passed in input.
      example:
        whitelisted: true
        whitelistedAt: string
        fiscalCode: string
  responses:
    Unauthorized:
      description: The request is not bound to an authenticated Wallet session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    Forbidden:
      description: The server understands the request but refuses to authorize it
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    Conflict:
      description: There has been a conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    UnprocessableContent:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemJson"
    RemoteWscdError:
      description: NSSAM proxy failure; see code
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RemoteWscdProblem"
